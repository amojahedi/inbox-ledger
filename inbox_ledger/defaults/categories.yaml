# Built-in categories and keyword rules. Matching is case-insensitive on the
# normalized merchant name. First matching category wins, so put the more
# specific ones (e.g. "careem food") above the general ones ("careem").
#
# Your own corrections in the app always take precedence over these.
#
# color: one of blue, orange, aqua, yellow, magenta, green, violet, red, gray —
# a colour-blind-safe palette with light and dark variants defined in the UI.

base_currency: AED

# Rates to the base currency, used for foreign-currency card purchases.
fx:
  AED: 1.0
  USD: 3.6725
  EUR: 4.0
  GBP: 4.7
  SAR: 0.98
  INR: 0.044

