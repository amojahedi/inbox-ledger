# Merchant brands.
#
# Ledger uses these to tint a merchant's round icon with the brand's colour and,
# only if you turn on "Merchant logos" in Settings, to download the brand's icon
# from the brand's OWN website (its apple-touch-icon or favicon). No third-party
# icon service is ever used. Logos are cached in <data dir>/logos/.
#
#   key     stable id, also accepted by GET /api/logo/{key}
#   domain  the brand's own website
#   color   brand colour for the monogram when there is no logo
#   match   whole-word keywords matched against the normalized merchant name;
#           prefix with "=" to require the whole name (e.g. "=du"). Longest match wins.
#   icon    optional icon URL or path on `domain`, when the site hides its icon
#
# Add your own in <data dir>/brands.yaml (same format; entries with the same key win).

